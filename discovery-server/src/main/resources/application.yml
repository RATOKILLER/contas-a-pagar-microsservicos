server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: localhost
  client:
    # O próprio servidor não se registra nem busca registros.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Em ambiente de aula, remove rápido instâncias que caíram.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
