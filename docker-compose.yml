# Sobe o sistema inteiro com um comando:   docker compose up -d --build
# Front-end: http://localhost:3000 · Gateway/API: http://localhost:8080
# Swagger (todas as APIs): http://localhost:8080/swagger-ui.html
# Eureka: http://localhost:8761 · RabbitMQ: http://localhost:15672 (cpr / cpr) · Zipkin: http://localhost:9411

name: cpr

x-servico-java: &servico-java
  restart: unless-stopped
  environment: &env-comum
    TZ: America/Sao_Paulo
    EUREKA_URL: http://discovery-server:8761/eureka
    ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    RABBIT_HOST: rabbitmq
    RABBIT_USER: cpr
    RABBIT_PASS: cpr
    DB_HOST: postgres
    DB_PORT: "5432"

services:
  # ---------------- Infraestrutura ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # 5433 no host para não conflitar com um PostgreSQL local
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: cpr
      RABBITMQ_DEFAULT_PASS: cpr
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"

  # ---------------- Plataforma ----------------
  discovery-server:
    build: ./discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"

  api-gateway:
    <<: *servico-java
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server

  # ---------------- Serviços de negócio ----------------
  pessoas-service:
    <<: *servico-java
    build: ./pessoas-service
    environment:
      <<: *env-comum
      DB_NAME: pessoas_db
      DB_USER: pessoas_user
      DB_PASS: pessoas_pass
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery-server: { condition: service_started }

  categorias-service:
    <<: *servico-java
    build: ./categorias-service
    environment:
      <<: *env-comum
      DB_NAME: categorias_db
      DB_USER: categorias_user
      DB_PASS: categorias_pass
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery-server: { condition: service_started }

  contas-pagar-service:
    <<: *servico-java
    build: ./contas-pagar-service
    environment:
      <<: *env-comum
      DB_NAME: contas_pagar_db
      DB_USER: contas_pagar_user
      DB_PASS: contas_pagar_pass
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery-server: { condition: service_started }

  contas-receber-service:
    <<: *servico-java
    build: ./contas-receber-service
    environment:
      <<: *env-comum
      DB_NAME: contas_receber_db
      DB_USER: contas_receber_user
      DB_PASS: contas_receber_pass
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery-server: { condition: service_started }

  relatorios-service:
    <<: *servico-java
    build: ./relatorios-service
    environment:
      <<: *env-comum
      DB_NAME: relatorios_db
      DB_USER: relatorios_user
      DB_PASS: relatorios_pass
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery-server: { condition: service_started }

  # ---------------- Front-end ----------------
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  pgdata:
