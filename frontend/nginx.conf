server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A API passa pelo gateway (mesma origem para o navegador: sem CORS).
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # React Router: qualquer rota desconhecida devolve o index.html (ex.: F5 em /contas-pagar).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
